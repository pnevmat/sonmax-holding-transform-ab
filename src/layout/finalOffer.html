<div class="finalOfferContainer">
  <div class="finalOfferWrapper">
    <div class="finalOfferTextContainer" id="form">
      <span>
        ЗАПОВНЮЙТЕ ВАШІ ДАНІ ТА ДОЛУЧАЙТЕСЬ ДО УЧАСНИКІВ МАЙСТЕР КЛАСУ
      </span>
      <div class="finalOfferTextWrapper">
        <span class="finalOfferText">«ТРАНСФОРМАЦІЯ БІЗНЕС-МОДЕЛІ»</span>
        <img class="arrowPc" src="./images/arrow-right.png" alt="Стрілка" />

    </div>
    <div class="finalOfferForm">

        ВЗЯТИ УЧАСТЬ

  </div>
